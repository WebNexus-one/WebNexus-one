<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Site - WebNexus</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --radius: 12px;
            --radius-sm: 8px;
        }

        body.light-mode {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .back-btn {
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: var(--radius);
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            margin-top: 0;
            color: var(--text-primary);
        }

        p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        button.submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button.submit-btn:hover {
            background: var(--accent-hover);
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn">← Back to Home</a>
    </div>

    <div class="container">
        <h2>Submit a Website</h2>
        <p>Suggest a new resource or web application to be added to WebNexus.</p>

        <!-- Formspree හෝ අදාළ backend form link එක action එකට යොදන්න -->
        <form action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST">
            <div class="form-group">
                <label>Website Name</label>
                <input type="text" name="site_name" placeholder="e.g. Canva" required>
            </div>

            <div class="form-group">
                <label>Website URL</label>
                <input type="url" name="site_url" placeholder="https://example.com" required>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select name="category" required>
                    <option value="" disabled selected>Select a category</option>
                    <option value="AI Tools">AI Tools</option>
                    <option value="Education">Education</option>
                    <option value="Design">Design</option>
                    <option value="Development">Development</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Country">Country</option>
                </select>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="4" placeholder="Briefly describe what this site does..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Resource</button>
        </form>
    </div>

    <script>
        if (localStorage.getItem("theme") === "light") {
            document.body.classList.add("light-mode");
        }
    </script>
</body>
</html>
